# Local development dependencies only. Do not expose these services to the internet
# or reuse these local credentials in a deployed environment.
services:
  postgres:
    image: postgres:17
    container_name: atlasrag-postgres
    environment:
      # These values come from infra/.env, with local-only defaults as a fallback.
      POSTGRES_DB: ${POSTGRES_DB:-atlasrag}
      POSTGRES_USER: ${POSTGRES_USER:-atlasrag}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-dev-postgres-password}
    ports:
      # Use a configurable host port (5433 by default) to avoid colliding with
      # a PostgreSQL installation already running on the usual port 5432.
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      # Keep database files when the container is recreated.
      - postgres_data:/var/lib/postgresql/data
      # Mount only the forward migration: mounting the whole migrations folder
      # would also run its destructive .down.sql file during database init.
      # This script runs once when postgres_data is first created.
      - ../migrations/000001_create_document_lifecycle.up.sql:/docker-entrypoint-initdb.d/001_create_document_lifecycle.sql:ro
      - ../migrations/000002_create_document_pages.up.sql:/docker-entrypoint-initdb.d/002_create_document_pages.sql:ro
      - ../migrations/000003_create_document_elements.up.sql:/docker-entrypoint-initdb.d/003_create_document_elements.sql:ro
    healthcheck:
      # Other services can wait for PostgreSQL to accept connections.
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  minio:
    # Build the local MinIO Community Edition source checkout into an image.
    # The clone is expected at <repo-root>/minio-src/minio-src.
    image: atlasrag-minio:local
    build:
      context: ../../minio-src/minio-src
      # Use AtlasRAG's build recipe instead of the upstream Dockerfile, which
      # expects prebuilt release artifacts and the old upstream base image.
      dockerfile: ../../aatlasrag/infra/minio/Dockerfile
    container_name: atlasrag-minio
    environment:
      # MinIO implements the S3 API locally; no AWS account is needed.
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-atlasrag-local}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-local-dev-minio-password}
    ports:
      # Port 9000 is the S3 API used by the Go backend.
      - "127.0.0.1:9000:9000"
      # Port 9001 is the MinIO web console for inspecting/creating buckets.
      - "127.0.0.1:9001:9001"
    volumes:
      # Keep uploaded PDFs when the container is recreated.
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9000/minio/health/ready >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  kafka:
    # Single-node KRaft broker for local development; no ZooKeeper is required.
    image: apache/kafka:4.1.1
    container_name: atlasrag-kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # INTERNAL is for Compose services; EXTERNAL is for the Go API on the host.
      KAFKA_LISTENERS: INTERNAL://:29092,CONTROLLER://:29093,EXTERNAL://:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    ports:
      - "127.0.0.1:9092:9092"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:29092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  python-worker:
    build:
      context: ../apps/workers-python
      dockerfile: Dockerfile
    container_name: atlasrag-python-worker
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-atlasrag}:${POSTGRES_PASSWORD:-local-dev-postgres-password}@postgres:5432/${POSTGRES_DB:-atlasrag}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_TOPIC: document.uploaded
      KAFKA_GROUP_ID: atlasrag-parser
      # Large PDFs can take longer than Kafka's default five-minute poll interval.
      KAFKA_MAX_POLL_INTERVAL_MS: ${KAFKA_MAX_POLL_INTERVAL_MS:-1800000}
      S3_ENDPOINT: minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-atlasrag-local}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-local-dev-minio-password}
      S3_BUCKET: ${S3_BUCKET:-atlasrag-documents}
      S3_USE_SSL: "false"
      MAX_PDF_BYTES: ${MAX_UPLOAD_BYTES:-52428800}
      # Opt in to the slower multimodal extraction pipeline with "unstructured".
      PDF_EXTRACTOR: ${PDF_EXTRACTOR:-pypdf}
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      kafka:
        condition: service_healthy
    restart: unless-stopped

volumes:
  # Named volumes are managed by Docker and survive `docker compose down`.
  postgres_data:
  minio_data:
  kafka_data:
