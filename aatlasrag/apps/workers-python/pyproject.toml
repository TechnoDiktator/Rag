[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "atlasrag-workers"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "kafka-python>=2.0.2",
    "minio>=7.2.15",
    "psycopg[binary]>=3.2.3",
    "pypdf>=5.1.0",
    "unstructured[pdf]==0.18.14",
    "unstructured-inference==1.0.5",
]

[tool.setuptools.packages.find]
where = ["src"]
